<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>

    <script src="https://kit.fontawesome.com/3074568ad1.js"></script>

    <script type="module" src="/demos/gsap/floating-reveal.js"></script>
  </head>
  <body class="h-screen w-full overflow-hidden bg-slate-900 text-white">
    <div class="pointer-events-none fixed inset-0 z-0">
      <div class="circle absolute top-[10%] left-[10%] h-72 w-72 rounded-full bg-indigo-500/60"></div>
      <div class="circle absolute right-[10%] bottom-[15%] h-80 w-80 rounded-full bg-teal-500/60"></div>
      <div class="circle absolute top-[40%] left-[30%] h-64 w-64 rounded-full bg-pink-500/60"></div>
    </div>

    <div class="relative z-10 flex h-full w-full flex-col items-center justify-center overflow-hidden">
      <div class="text-center">
        <h1 class="mb-4 text-5xl font-bold -tracking-widest md:text-7xl">
          <span class="title inline-block">G</span>
          <span class="title inline-block">S</span>
          <span class="title inline-block">A</span>
          <span class="title inline-block">P</span>
        </h1>
        <p class="desc mb-8 text-lg text-slate-400 md:text-xl">Floating & Reveal</p>
        <button
          id="replay-btn"
          class="rounded-full border border-white/20 bg-white/10 px-6 py-2 text-sm tracking-widest transition-[background-color] hover:bg-white/20"
        >
          Replay
        </button>
      </div>
    </div>
  </body>
</html>
