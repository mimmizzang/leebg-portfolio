<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>

    <script src="https://kit.fontawesome.com/3074568ad1.js"></script>

    <script type="module" src="/demos/gsap/scroll-trigger.js"></script>
  </head>
  <body class="bg-slate-900 text-white">
    <section class="flex h-screen flex-col items-center justify-center text-center">
      <div class="mb-6 text-teal-400">
        <i class="fa-solid fa-mouse animate-bounce text-3xl"></i>
      </div>
      <h1 class="text-6xl font-black tracking-tighter md:text-8xl">SCROLL</h1>
    </section>

    <div class="container mx-auto max-w-2xl space-y-80 px-6 pb-80">
      <section class="section-container flex flex-col items-center">
        <div
          class="reveal-box flex aspect-video w-full items-center justify-center rounded-3xl bg-teal-500 shadow-2xl shadow-teal-500/20"
        >
          <h2 class="reveal-text text-4xl font-black tracking-tighter text-slate-900 md:text-6xl">GSAP</h2>
        </div>
      </section>

      <section class="section-container flex flex-col items-center">
        <div
          class="reveal-box flex aspect-video w-full items-center justify-center rounded-3xl bg-indigo-500 shadow-2xl shadow-indigo-500/20"
        >
          <h2 class="reveal-text text-4xl font-black tracking-tighter text-slate-900 md:text-6xl">ScrollTrigger</h2>
        </div>
      </section>

      <section class="section-container flex flex-col items-center">
        <div
          class="reveal-box flex aspect-video w-full items-center justify-center rounded-3xl bg-pink-500 shadow-2xl shadow-pink-500/20"
        >
          <h2 class="reveal-text text-4xl font-black tracking-tighter text-slate-900 md:text-6xl">Interaction</h2>
        </div>
      </section>
    </div>
  </body>
</html>
